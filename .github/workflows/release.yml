name: Installers bouwen en publiceren

on:
  push:
    branches: [main]
    paths:
      - src/**
      - native/**
      - tests/**
      - third_party/**
      - packaging/**
      - .github/workflows/release.yml
      - docs/releases/**
  workflow_dispatch:

permissions:
  contents: read

env:
  SOUNDSAUSAGE_LANGUAGE: en
  QT_QPA_PLATFORM: offscreen
  QT_AUDIO_BACKEND: pulseaudio
  PULSE_SERVER: unix:/tmp/soundsausage-pulse/native
  SOUNDSAUSAGE_AUDIO_TEST: '1'
  SOUNDSAUSAGE_PLUGIN_UI_TEST: '1'
  DISPLAY: ':97'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(python3 -c 'import ast; print(ast.literal_eval(open("src/soundsausage/__init__.py").read().split("=", 1)[1].strip()))')
          test -f "docs/releases/$version.md"
          test "$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir dist
          git archive --format=tar.gz --prefix="soundsausage-$version/" --output="dist/soundsausage-$version.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*.tar.gz

  debian:
    needs: source
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++ make python3 python3-numpy python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtwidgets python3-pyside6.qttest python3-pyside6.qtmultimedia qt6-qpa-plugins qt6-translations-l10n libsamplerate0 librubberband2 pulseaudio liblilv-0-0 libxcb-cursor0 xvfb fonts-dejavu-core ffmpeg python3-mutagen
      - name: Private virtual audio device
        run: |
          getent group pulse >/dev/null || groupadd --system pulse
          id -u pulse >/dev/null 2>&1 || useradd --system --gid pulse --home-dir /tmp/soundsausage-pulse pulse
          mkdir -p /tmp/soundsausage-pulse
          chown pulse:pulse /tmp/soundsausage-pulse
          Xvfb :97 -screen 0 1280x800x24 -nolisten tcp > /tmp/soundsausage-xvfb.log 2>&1 &
          sleep 1
          env -u PULSE_SERVER -u XDG_CONFIG_HOME -u XDG_RUNTIME_DIR PULSE_RUNTIME_PATH=/tmp/soundsausage-pulse/runtime PULSE_STATE_PATH=/tmp/soundsausage-pulse/state pulseaudio --system -n --daemonize=yes --exit-idle-time=-1 --log-target=file:/tmp/soundsausage-pulse.log --load='module-native-protocol-unix socket=/tmp/soundsausage-pulse/native auth-anonymous=1' --load='module-null-sink sink_name=soundsausage_test rate=48000 channels=2' --load='module-null-source source_name=soundsausage_input rate=48000 channels=2' --load='module-remap-source master=soundsausage_test.monitor source_name=soundsausage_loopback source_properties=device.description=SoundSausageLoopback' || { cat /tmp/soundsausage-pulse.log; exit 1; }
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Build, test and package
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          tar xzf "soundsausage-$VERSION.tar.gz"
          cd "soundsausage-$VERSION"
          make test
          sh packaging/stage.sh ../root
          mkdir -p ../root/DEBIAN
          sed "s/@VERSION@/$VERSION/" packaging/debian/control.in > ../root/DEBIAN/control
          echo "Installed-Size: $(du -sk ../root/usr | cut -f1)" >> ../root/DEBIAN/control
          cd ..
          dpkg-deb --root-owner-group --build root "soundsausage_${VERSION}-1_amd64.deb"
      - name: Install and smoke test
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          export SOUNDSAUSAGE_TEST_VST3="$PWD/soundsausage-$VERSION/build/vst3-test-gain.so"
          apt-get install -y ./soundsausage_*_amd64.deb
          cd /tmp
          soundsausage --selftest
          soundsausage --audio-selftest
          soundsausage --input-selftest
          soundsausage --duplex-selftest
      - uses: actions/upload-artifact@v4
        with: { name: debian, path: "soundsausage_*_amd64.deb" }
      - uses: actions/upload-artifact@v4
        with:
          name: check-plugin
          path: soundsausage-${{ needs.source.outputs.version }}/build/vst3-test-gain.so

  ubuntu:
    needs: debian
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:26.04", "ubuntu:rolling"]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: debian }
      - uses: actions/download-artifact@v4
        with: { name: check-plugin }
      - name: Install the same package and smoke test
        env:
          UBUNTU_IMAGE: ${{ matrix.image }}
        run: |
          ubuntu_mirror_address=$(getent ahostsv4 mirrors.edge.kernel.org | awk 'NR == 1 {print $1}')
          test -n "$ubuntu_mirror_address"
          docker run --rm -i --network host \
            --add-host "mirrors.edge.kernel.org:$ubuntu_mirror_address" \
            -e SOUNDSAUSAGE_LANGUAGE -e QT_QPA_PLATFORM -e QT_AUDIO_BACKEND \
            -e PULSE_SERVER -e SOUNDSAUSAGE_AUDIO_TEST -e SOUNDSAUSAGE_PLUGIN_UI_TEST -e DISPLAY \
            -v /etc/resolv.conf:/etc/resolv.conf:ro \
            -v "$PWD:/packages:ro" "$UBUNTU_IMAGE" sh -eu <<'UBUNTU_CHECK'
          cd /packages
          export SOUNDSAUSAGE_TEST_VST3=/packages/vst3-test-gain.so
          cat /etc/resolv.conf
          getent ahostsv4 mirrors.edge.kernel.org
          sed -i -E 's#https?://(archive|security)\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#g' /etc/apt/sources.list.d/ubuntu.sources
          for attempt in 1 2 3; do
            if apt-get -o APT::Update::Error-Mode=any -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update; then
              break
            fi
            test "$attempt" -lt 3 || exit 1
            sleep 5
          done
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ./soundsausage_*_amd64.deb pulseaudio xvfb libxcb-cursor0
          getent group pulse >/dev/null || groupadd --system pulse
          id -u pulse >/dev/null 2>&1 || useradd --system --gid pulse --home-dir /tmp/soundsausage-pulse pulse
          mkdir -p /tmp/soundsausage-pulse
          chown pulse:pulse /tmp/soundsausage-pulse
          Xvfb :97 -screen 0 1280x800x24 -nolisten tcp > /tmp/soundsausage-xvfb.log 2>&1 &
          sleep 1
          env -u PULSE_SERVER -u XDG_CONFIG_HOME -u XDG_RUNTIME_DIR PULSE_RUNTIME_PATH=/tmp/soundsausage-pulse/runtime PULSE_STATE_PATH=/tmp/soundsausage-pulse/state pulseaudio --system -n --daemonize=yes --exit-idle-time=-1 --log-target=file:/tmp/soundsausage-pulse.log --load='module-native-protocol-unix socket=/tmp/soundsausage-pulse/native auth-anonymous=1' --load='module-null-sink sink_name=soundsausage_test rate=48000 channels=2' --load='module-null-source source_name=soundsausage_input rate=48000 channels=2' --load='module-remap-source master=soundsausage_test.monitor source_name=soundsausage_loopback source_properties=device.description=SoundSausageLoopback' || { cat /tmp/soundsausage-pulse.log; exit 1; }
          cd /tmp
          soundsausage --selftest
          soundsausage --audio-selftest
          soundsausage --input-selftest
          soundsausage --duplex-selftest
          UBUNTU_CHECK

  fedora:
    needs: source
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Build dependencies with all interface languages
        run: |
          printf '%s\n' '%_install_langs all' > /etc/rpm/macros.image-language-conf
          rpm --eval '%{_install_langs}'
          dnf install -y rpm-build gcc-c++ make python3-pyside6 qt6-qtmultimedia qt6-qttranslations python3-numpy libsamplerate rubberband-libs pulseaudio lilv xorg-x11-server-Xvfb dejavu-sans-fonts dejavu-sans-mono-fonts ffmpeg-free python3-mutagen
          test -f /usr/share/qt6/translations/qtbase_nl.qm
      - name: Private virtual audio device
        run: |
          getent group pulse >/dev/null || groupadd --system pulse
          id -u pulse >/dev/null 2>&1 || useradd --system --gid pulse --home-dir /tmp/soundsausage-pulse pulse
          mkdir -p /tmp/soundsausage-pulse
          chown pulse:pulse /tmp/soundsausage-pulse
          Xvfb :97 -screen 0 1280x800x24 -nolisten tcp > /tmp/soundsausage-xvfb.log 2>&1 &
          sleep 1
          env -u PULSE_SERVER -u XDG_CONFIG_HOME -u XDG_RUNTIME_DIR PULSE_RUNTIME_PATH=/tmp/soundsausage-pulse/runtime PULSE_STATE_PATH=/tmp/soundsausage-pulse/state pulseaudio --system -n --daemonize=yes --exit-idle-time=-1 --log-target=file:/tmp/soundsausage-pulse.log --load='module-native-protocol-unix socket=/tmp/soundsausage-pulse/native auth-anonymous=1' --load='module-null-sink sink_name=soundsausage_test rate=48000 channels=2' --load='module-null-source source_name=soundsausage_input rate=48000 channels=2' --load='module-remap-source master=soundsausage_test.monitor source_name=soundsausage_loopback source_properties=device.description=SoundSausageLoopback' || { cat /tmp/soundsausage-pulse.log; exit 1; }
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Build, test and package
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          tar xzf "soundsausage-$VERSION.tar.gz"
          cd "soundsausage-$VERSION"
          make test
          cd ..
          mkdir -p /tmp/rpmbuild/SOURCES
          cp "soundsausage-$VERSION.tar.gz" /tmp/rpmbuild/SOURCES/
          rpmbuild -bb --define '_topdir /tmp/rpmbuild' --define "ss_version $VERSION" "soundsausage-$VERSION/packaging/fedora/soundsausage.spec"
          cp /tmp/rpmbuild/RPMS/x86_64/soundsausage-*.rpm .
      - name: Install and smoke test
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          export SOUNDSAUSAGE_TEST_VST3="$PWD/soundsausage-$VERSION/build/vst3-test-gain.so"
          dnf install -y ./soundsausage-*.rpm
          cd /tmp
          soundsausage --selftest
          soundsausage --audio-selftest
          soundsausage --input-selftest
          soundsausage --duplex-selftest
      - uses: actions/upload-artifact@v4
        with: { name: fedora, path: "soundsausage-*.rpm" }

  arch:
    needs: source
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel pyside6 qt6-multimedia qt6-translations python-numpy libsamplerate rubberband pulseaudio lilv xorg-server-xvfb ttf-dejavu ffmpeg python-mutagen
      - name: Private virtual audio device
        run: |
          getent group pulse >/dev/null || groupadd --system pulse
          id -u pulse >/dev/null 2>&1 || useradd --system --gid pulse --home-dir /tmp/soundsausage-pulse pulse
          mkdir -p /tmp/soundsausage-pulse
          chown pulse:pulse /tmp/soundsausage-pulse
          Xvfb :97 -screen 0 1280x800x24 -nolisten tcp > /tmp/soundsausage-xvfb.log 2>&1 &
          sleep 1
          env -u PULSE_SERVER -u XDG_CONFIG_HOME -u XDG_RUNTIME_DIR PULSE_RUNTIME_PATH=/tmp/soundsausage-pulse/runtime PULSE_STATE_PATH=/tmp/soundsausage-pulse/state pulseaudio --system -n --daemonize=yes --exit-idle-time=-1 --log-target=file:/tmp/soundsausage-pulse.log --load='module-native-protocol-unix socket=/tmp/soundsausage-pulse/native auth-anonymous=1' --load='module-null-sink sink_name=soundsausage_test rate=48000 channels=2' --load='module-null-source source_name=soundsausage_input rate=48000 channels=2' --load='module-remap-source master=soundsausage_test.monitor source_name=soundsausage_loopback source_properties=device.description=SoundSausageLoopback' || { cat /tmp/soundsausage-pulse.log; exit 1; }
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Build as an ordinary user
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          tar xzf "soundsausage-$VERSION.tar.gz"
          cd "soundsausage-$VERSION"
          make test
          cd ..
          useradd -m builder
          mkdir -p /home/builder/pkg
          cp "soundsausage-$VERSION.tar.gz" "soundsausage-$VERSION/packaging/PKGBUILD" /home/builder/pkg/
          chown -R builder /home/builder/pkg
          su builder -c 'cd /home/builder/pkg && makepkg --noconfirm'
          cp /home/builder/pkg/soundsausage-*.pkg.tar.zst .
      - name: Install and smoke test
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          export SOUNDSAUSAGE_TEST_VST3="$PWD/soundsausage-$VERSION/build/vst3-test-gain.so"
          pacman -U --noconfirm soundsausage-*.pkg.tar.zst
          cd /tmp
          soundsausage --selftest
          soundsausage --audio-selftest
          soundsausage --input-selftest
          soundsausage --duplex-selftest
      - uses: actions/upload-artifact@v4
        with: { name: arch, path: "soundsausage-*.pkg.tar.zst" }

  publish:
    if: github.event_name == 'push'
    needs: [source, debian, ubuntu, fedora, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: source, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: debian, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: fedora, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: arch, path: dist }
      - name: Tag and publish all tested installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          cd dist
          sha256sum soundsausage-* soundsausage_* > SHA256SUMS
          cd ..
          for notes in docs/releases/*.md; do
            notes_version=$(basename "$notes" .md)
            if gh release view "v$notes_version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "v$notes_version" -R "$GITHUB_REPOSITORY" --notes-file "$notes"
            fi
          done
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; it will not be overwritten."
            exit 0
          fi
          gh release create "v$VERSION" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SoundSausage $VERSION" --notes-file "docs/releases/$VERSION.md"
