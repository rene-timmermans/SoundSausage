name: Plug-in host checks
on:
  push:
    branches: [work/v1-closure]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: [debian, fedora, arch]
        include:
          - distribution: debian
            image: debian:trixie
          - distribution: fedora
            image: fedora:latest
          - distribution: arch
            image: archlinux:latest
    container: ${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
      SOUNDSAUSAGE_LANGUAGE: en
      SOUNDSAUSAGE_PLUGIN_UI_TEST: '1'
      DISPLAY: ':97'
    steps:
      - name: Debian dependencies
        if: matrix.distribution == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git g++ make python3 python3-numpy python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtwidgets python3-pyside6.qttest python3-pyside6.qtmultimedia qt6-qpa-plugins qt6-translations-l10n libsamplerate0 librubberband2 liblilv-0-0 libxcb-cursor0 xvfb fonts-dejavu-core ffmpeg python3-mutagen
      - name: Fedora dependencies
        if: matrix.distribution == 'fedora'
        run: |
          printf '%s\n' '%_install_langs all' > /etc/rpm/macros.image-language-conf
          dnf install -y git gcc-c++ make python3-pyside6 qt6-qtmultimedia qt6-qttranslations python3-numpy libsamplerate rubberband-libs lilv xorg-x11-server-Xvfb dejavu-sans-fonts ffmpeg-free python3-mutagen
      - name: Arch dependencies
        if: matrix.distribution == 'arch'
        run: pacman -Syu --noconfirm --needed git base-devel pyside6 qt6-multimedia qt6-translations python-numpy libsamplerate rubberband lilv xorg-server-xvfb ttf-dejavu ffmpeg python-mutagen
      - uses: actions/checkout@v4
      - name: Isolated display and plug-in checks
        run: |
          Xvfb :97 -screen 0 1280x800x24 -nolisten tcp > /tmp/soundsausage-xvfb.log 2>&1 &
          soundsausage_display_pid=$!
          trap 'kill "$soundsausage_display_pid" || true' EXIT
          sleep 2
          kill -0 "$soundsausage_display_pid" || { cat /tmp/soundsausage-xvfb.log; exit 1; }
          export SOUNDSAUSAGE_CACHE_DIR="$PWD/build/check-cache"
          export XDG_CONFIG_HOME="$PWD/build/check-config"
          export PYTHONPATH=src:tests
          make all
          python3 -m unittest test_plugins test_linux_plugins test_realtime test_session -v
